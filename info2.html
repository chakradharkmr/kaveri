    <!-- Chosen Palette: Warm Neutrals with Subtle Accents -->
    <!-- Application Structure Plan: The SPA is designed as an interactive dashboard. The core is a filtering system allowing users to select activities by Type (Sport, Kunst, etc.), Cost, and Diploma availability. Results are displayed as dynamic cards in a grid. Clicking a card opens a modal with full details. This structure empowers users to quickly find relevant information based on their specific needs, which is more efficient than reading a linear report. Key interactions include filter selection, card clicking for modals, and hovering over charts for tooltips. -->
    <!-- Visualization & Content Choices: 
        - Report Info: Distribution of activity types -> Goal: Compare -> Viz: Donut Chart -> Justification: Clearly shows proportions of the whole catalog -> Library: Chart.js/Canvas.
        - Report Info: Range of costs -> Goal: Compare -> Viz: Bar Chart -> Justification: Effectively compares price points across different activity categories -> Library: Chart.js/Canvas.
        - Report Info: Detailed activity listings -> Goal: Inform/Organize -> Presentation: Interactive Cards + Modals -> Justification: Keeps the main view clean while providing deep detail on demand. Filtering the cards makes the data explorable -> Method: HTML/CSS/JS.
        - Report Info: Diploma/Certification availability -> Goal: Organize -> Presentation: Filter button + Icon on card (🏆) -> Justification: Provides a quick visual cue and powerful filtering capability without needing a separate chart -> Method: HTML/CSS/JS.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F7F4; color: #4A4A4A; }

        .filter-btn.active { background-color: #A8D5BA; color: #2C5E4A; border-color: #2C5E4A; font-weight: 600; }
        .activity-card { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; }
        .activity-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .modal-backdrop { display: none; position: fixed; z-index: 50; inset: 0; background-color: rgba(0,0,0,0.5); }
        .modal-content { max-height: 90vh; }
        .chart-container { position: relative; width: 100%; max-width: 450px; margin-left: auto; margin-right: auto; height: 320px; max-height: 350px; }
        @media (min-width: 768px) { .chart-container { height: 350px; } }
    </style>
</head>

                            <button data-filter="no" class="filter-btn py-2 px-4 border border-gray-300 rounded-full text-sm">Without Diploma</button>

                        <p class="text-gray-600 text-sm mb-4">${activity.summary}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500 border-t pt-4">

                            <span class="font-semibold">${costText}</span>
                        </div>

                            (currentFilters.cost === 'medium' && a.cost !== null && a.cost >= 50) ||
                            (currentFilters.cost === 'unknown' && a.cost === null);

                        const diplomaMatch = currentFilters.diploma === 'all' ||
                            (currentFilters.diploma === 'yes' && a.diploma) ||
                            (currentFilters.diploma === 'no' && !a.diploma);

                        return typeMatch && costMatch && diplomaMatch;
                    })
                    .forEach(activity => {
                        hasResults = true;
                        grid.appendChild(createActivityCard(activity));
                    });
                noResults.classList.toggle('hidden', hasResults);
            };
            
            const openModal = (activity) => {
                document.getElementById('modal-title').innerText = activity.title;
                document.getElementById('modal-body').innerHTML = `
                    <div class="mb-4 space-y-2">
                        <p><strong>Category:</strong> ${activity.category}</p>
                        <p><strong>Location:</strong> ${activity.location} (${activity.distance})</p>
                        <p><strong>Age Suitability:</strong> ${activity.age}</p>
                    </div>
                    ${activity.details}
                `;
                modal.style.display = 'flex';
            };
            
            closeModal.addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });

            const setupFilter = (filterContainer, filterKey) => {
                 filterContainer.addEventListener('click', e => {
                    if (e.target.tagName === 'BUTTON') {
                        currentFilters[filterKey] = e.target.dataset.filter;
                        filterContainer.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                        e.target.classList.add('active');
                        renderActivities();
                    }
                });
            };

            setupFilter(typeFilter, 'type');
            setupFilter(costFilter, 'cost');
            setupFilter(diplomaFilter, 'diploma');

            const wrapLabel = (str, maxWidth) => {
                if (!str || str.length <= maxWidth) return str;
                const words = str.split(' ');
                let lines = []; let currentLine = '';
                for (const word of words) {
                    if ((currentLine + ' ' + word).trim().length > maxWidth) {
                        lines.push(currentLine.trim()); currentLine = word;
                    } else { currentLine = (currentLine + ' ' + word).trim(); }
                }
                if (currentLine) lines.push(currentLine.trim());
                return lines;
            };

            const tooltipTitleCallback = (tooltipItems) => {
                const item = tooltipItems[0];
                let label = item.chart.data.labels[item.dataIndex];
                return Array.isArray(label) ? label.join(' ') : label;
            };

            const sharedChartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: { title: tooltipTitleCallback },
                        backgroundColor: '#4A4A4A',
                        titleFont: { size: 14 },
                        bodyFont: { size: 12 },
                        padding: 10,
                        cornerRadius: 4
                    }
                }
            };
            
            const categoryChartCtx = document.getElementById('categoryChart').getContext('2d');
            const categoryData = activities.reduce((acc, curr) => {
                acc[curr.category] = (acc[curr.category] || 0) + 1;
                return acc;
            }, {});
            new Chart(categoryChartCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categoryData),
                    datasets: [{
                        data: Object.values(categoryData),
                        backgroundColor: ['#7BAF9E', '#A8D5BA', '#E9E4D4'],
                        borderColor: '#F8F7F4',
                        borderWidth: 4,
                    }]
                },
                options: { ...sharedChartOptions, cutout: '60%', plugins: {...sharedChartOptions.plugins, legend: {display: true, position: 'bottom'}} }
            });

            const costChartCtx = document.getElementById('costChart').getContext('2d');
            const costData = {
                'Free': activities.filter(a => a.cost === 0).length,
                '< €50/month': activities.filter(a => a.cost !== null && a.cost > 0 && a.cost < 50).length,
                '> €50/month': activities.filter(a => a.cost !== null && a.cost >= 50).length,
                'Inquire for info': activities.filter(a => a.cost === null).length,
            };
            new Chart(costChartCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(costData),
                    datasets: [{
                        label: 'Number of Activities',
                        data: Object.values(costData),
                        backgroundColor: ['#A8D5BA', '#7BAF9E', '#568B79', '#E9E4D4'],
                    }]
                },
                options: {
                    ...sharedChartOptions,
                    indexAxis: 'y',
                    scales: {
                        x: { beginAtZero: true, grid: { display: false } },
                        y: { grid: { display: false } }
                    },
                }
            });
            
            renderActivities();
        });
    </script>
</body>
</html>
